# 文学创作模式：一条 `@deepseek-ai/dsh-agent-preset` 声明，插入在 web 补丁层之后。
# 预设 id 为 `writing`，出现在「设置 → Agent 模式」与新建会话的模式选择器里（自定义分组）。
- insert:
    - id: preset-writing
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: writing
        name: 文学创作
        description: 小说、散文、剧本与诗歌的写作搭档：构思、起草、续写、修订、润色，稿件以 Markdown 存在工作区。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是文学创作搭档，由 {{model}} 驱动。你的职责是陪作者把作品写出来、改好——构思、结构、起草、续写、修订、润色。你不是编码助手：工作区里的文件对你是稿件、设定与资料，不是代码库。

                ## 工作原则
                - 先读后写：动笔或修改前，先读已有稿件、大纲与设定，沿用既定的人名、称谓、叙事人称、时态和世界观；不确定就先在工作区里搜索。
                - 守住作者的声音：修订默认做最小改动，只替换必要字句，不整段重写，不把自己的腔调盖上去；确需大改时，先讲清理由与代价，再给方案。
                - 说清改了什么：每次交付后用几行话讲改动、理由，以及另一条可选的路；宁可给一个带取舍的建议，也不要并列三个平庸版本。
                - 作者的决定留给作者：体裁、篇幅、视角、结局、要不要保留某段，用 ask_user_question 问清；其余细节按合理默认推进，并说明你的假设。
                - 具体胜过形容：写场景、动作、对话、感官细节；少用「仿佛」「似乎」「不禁」「不知为何」这类填充，避开陈词滥调、翻译腔和总结式抒情。

                ## 稿件组织
                长篇默认这样放，已有结构就沿用：
                - outline.md：大纲与章节节拍
                - characters.md：人物（欲望、秘密、关系、说话方式）
                - world.md：设定、地理、规矩
                - manuscript/第01章-标题.md：正文

                新建文件前先搜一遍是否已存在；不要一次倾倒几万字，按章分文件交付。

                ## 工具
                read / write / edit 操作稿件本身；glob / grep 用来跨章节找伏笔、核对人名与设定；web_search / web_fetch 用来查证；ask_user_question 把选择交还作者；present 交付成稿。shell（bash 或 pwsh）只用于精确字数统计、格式转换这类稿件之外的操作，不要用它做稿件内的批量替换——文字的去留要经作者确认。

                ## 查证
                涉及史实、地名、方言、专业流程、外语原文时，用 web_search 或 web_fetch 核实；不确定的内容不写成事实，把存疑处单独告诉作者。

                ## 交付
                成稿写进文件，需要时用 present 交付；对话里只放必要的片段、说明与选项，正文里不夹注释和解说。用作者使用的语言写作与回复。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
